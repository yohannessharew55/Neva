name: Build Standalone iOS App (IPA)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS 16+ App (.ipa)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (LTS 22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Production Assets
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Compile Native iOS Application
        run: |
          cd ios/App
          if [ -d "App.xcworkspace" ]; then
            xcodebuild -workspace App.xcworkspace \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              build
          else
            xcodebuild -project App.xcodeproj \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              build
          fi

      - name: Package Unsigned IPA for Sideloading
        run: |
          cd ios/App
          APP_PATH=$(find build -name "App.app" -type d | head -n 1)
          echo "Found app bundle at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -qr NEVA.ipa Payload
          ls -lh NEVA.ipa
          echo "IPA Size:" $(du -h NEVA.ipa)

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEVA-iOS16-App
          path: ios/App/NEVA.ipa
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: "NEVA iOS 16+ Production Build v1.0.0"
          body: |
            ### 📱 NEVA Standalone iOS App (Native IPA)
            - **Target Devices**: iPhone X and all devices running iOS 16.0+
            - **Architecture**: ARM64 Mach-O Native App
            - **Features**:
              - Native Apple Reminders & EventKit sync
              - Native Time-Sensitive Phone Alarms (UNUserNotificationCenter)
              - 10 Acoustic Focus Soundscapes (Tibetan bowls, 432Hz waves, temple bells)
              - Complete offline functionality
            - **Installation**: Drag & drop `NEVA.ipa` into **Sideloadly**, **AltStore**, or **TrollStore** with your Apple ID.
          files: ios/App/NEVA.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
